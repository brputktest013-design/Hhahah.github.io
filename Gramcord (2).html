<title>Gramcord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000'/%3E%3Cg transform='translate(96 97.6) scale(3.2)'%3E%3Cpath fill='%23fff' d='M50 6C26 6 8 24 8 46c0 12 5 22 13 30-1 7-4 13-9 17 9 0 17-3 23-8 5 2 10 3 15 3 24 0 42-18 42-40S74 6 50 6Z'/%3E%3Cpath fill='none' stroke='%23000' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' d='M66 35C62 30 56 28 50 28c-10 0-18 8-18 18s8 18 18 18c8 0 15-5 16-13H51'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--e:cubic-bezier(.22,1,.36,1);--bg:#fff;--b2:#f2f3f5;--b3:#e3e5e8;--tx:#2e3338;--mu:#5c6370;--ac:#5865f2;--hv:#e0e2e6;--ok:#23a559;--er:#da373c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#313338;--b2:#2b2d31;--b3:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--hv:#3a3c41;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#313338;--b2:#2b2d31;--b3:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--hv:#3a3c41;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--b3);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;transition:transform .2s var(--e),background-color .25s,color .25s,opacity .25s,border-radius .3s var(--e)}button:active{transform:scale(.95)}input,select{transition:border-color .2s,outline-color .2s}
input,select{background:var(--b3);border:1px solid transparent;border-radius:8px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}
#app{height:100%;display:flex;flex-direction:column}
.btn{background:var(--ac);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.g{background:var(--hv);color:var(--tx)}.btn.d{background:var(--er)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.g.on{background:var(--ac);color:#fff}.bd.cl{width:1.5em;height:1.5em;border-radius:32%;justify-content:center;color:#fff;font-size:.72em}.sw{animation:in .4s var(--e)}.row{transition:background-color .25s,transform .3s var(--e)}.row:hover{transform:translateY(-1px)}.av{transition:transform .3s var(--e)}.av:hover{transform:scale(1.08)}.ch:hover{transform:translateX(3px)}
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--bg);border-radius:12px;padding:28px;width:100%;max-width:400px;display:grid;gap:14px}
.card h1{margin:0;font-size:24px}.mu{color:var(--mu);font-size:13px}.err{color:var(--er);font-size:13px;min-height:18px}
#code{letter-spacing:.5em;text-align:center;font-size:22px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:64px 240px 1fr}
#rail{background:var(--b3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow:auto}
.sv{width:46px;height:46px;border-radius:50%;background:var(--bg);font-size:22px}
.sv:hover,.sv.on{border-radius:14px;background:var(--ac)}
#chans{background:var(--b2);display:flex;flex-direction:column;min-height:0}
#chans h2{margin:0;padding:14px;font-size:15px;border-bottom:1px solid var(--b3)}
#cl{flex:1;overflow:auto;padding:8px}
.ch{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:var(--mu)}
.ch:hover,.ch.on{background:var(--hv);color:var(--tx)}
#me{background:var(--b3);display:flex;align-items:center;gap:10px;padding:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.vf{color:var(--ac);margin-left:4px}
#chat{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0}
#hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b3);font-weight:600}
#bk{display:none;font-size:20px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:10px}.m .b{min-width:0;overflow-wrap:anywhere}
.m small{color:var(--mu);margin-left:8px}
#cmp{display:flex;gap:8px;padding:12px}
#music{flex:1;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start}
.np{background:var(--b2);border-radius:12px;padding:18px;display:grid;gap:12px;text-align:center}
.np .t{font-size:18px;font-weight:700}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;font-size:24px}
.ctl .pp{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px}
.tk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:8px}
.tk:hover,.tk.on{background:var(--hv)}
input[type=range]{padding:0;background:none;accent-color:var(--ac)}
#mini{display:none;align-items:center;gap:12px;background:var(--b2);border-top:1px solid var(--b3);padding:8px 14px}
#mini.on{display:flex}#mini .nm{font-weight:500}
#set{position:fixed;inset:0;background:var(--bg);display:flex;visibility:hidden;opacity:0;transform:translateY(26px) scale(.97);transition:opacity .3s var(--e),transform .5s var(--e),visibility 0s .5s;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#set.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--b3)}
#tabs button{padding:8px 14px;border-radius:20px;background:var(--b2);white-space:nowrap}
#tabs button.on{background:var(--ac);color:#fff}
#sb{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start;max-width:560px;width:100%;margin:0 auto}
.row{background:var(--b2);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.row>div{min-width:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;visibility:hidden;transition:opacity .3s var(--e),transform .4s var(--e),visibility 0s .4s;background:var(--b3);border:1px solid var(--ac);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%);transition-delay:0s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
html,body{transition:background-color .4s,color .4s}
#s1,#s2,#s3{animation:in .45s var(--e)}.card{animation:in .6s var(--e)}#main{animation:in .5s var(--e)}
.m.n{animation:in .4s var(--e)}@keyframes sr{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#sb.fx>*{animation:in .5s var(--e) both}#sb.fx>:nth-child(2){animation-delay:.04s}#sb.fx>:nth-child(3){animation-delay:.08s}#sb.fx>:nth-child(4){animation-delay:.12s}#sb.fx>:nth-child(n+5){animation-delay:.16s}.ex{animation:in .35s var(--e) both}#mini.on{animation:up .45s var(--e)}
.bd{display:inline-flex;align-items:center;vertical-align:middle;margin-left:4px;font-size:.85em;cursor:pointer}.bd.dev{background:var(--hv);border-radius:6px;padding:1px 6px;font-weight:700;font-family:ui-monospace,monospace;color:var(--ac)}.bd.t{color:var(--ac)}.bd svg{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:699px){
#main{display:flex}#chat{display:none;flex:1}#chans{flex:1}
#main.v #rail,#main.v #chans{display:none}#main.v #chat{display:flex}
#bk{display:block}#chat,#chans{animation:sl .38s var(--e)}#main.rv #chans{animation-name:sr}}

#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;transition:opacity .7s ease,visibility .7s;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
#splash .av2{position:relative;width:min(52vw,230px);aspect-ratio:1;display:grid;place-items:center;animation:spPop 1.4s cubic-bezier(.22,1,.36,1) both,spOut .7s ease 3.05s forwards}
#splash .em{width:100%;height:100%;overflow:visible;position:relative;z-index:1}
#splash .ring,#splash .gl,#splash .crc,#splash .rp1,#splash .rp2{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
#splash .ring{stroke-width:2.6;animation:spDraw 1.1s cubic-bezier(.65,0,.35,1) .2s forwards,spFill .5s ease 1.3s forwards}
#splash .gl{stroke-width:5;animation:spDraw .8s cubic-bezier(.65,0,.35,1) .8s forwards,spGl .4s ease 1.4s forwards}
#splash .crc{stroke-width:1.4;opacity:.9;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);animation:spDraw 1.1s cubic-bezier(.65,0,.35,1) 1.5s forwards}
#splash .rp1,#splash .rp2{stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
#splash .rp1{animation:spRip 1.6s ease-out 1.9s infinite}
#splash .rp2{animation:spRip 1.6s ease-out 2.7s infinite}
#splash .wm{display:flex;font:700 clamp(22px,6vw,32px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;animation:spOut .7s ease 3.05s forwards}
#splash .wm i{font-style:normal;opacity:0;transform:translateY(12px);filter:blur(6px);animation:spLt .7s cubic-bezier(.22,1,.36,1) forwards}
#splash .glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);opacity:0;animation:spGlow 2s ease .6s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{fill:#fff}}
@keyframes spGl{to{stroke:#000}}
@keyframes spPop{0%{transform:scale(.7) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spLt{to{opacity:1;transform:none;filter:none}}
@keyframes spOut{to{opacity:0;transform:scale(1.15)}}
@keyframes spRip{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes spGlow{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes spFade{to{opacity:0}}
@media(prefers-reduced-motion:reduce){#splash .av2{animation:spFade .7s ease 3.05s forwards}#splash .wm{animation:spFade .7s ease 3.05s forwards}#splash .rp1,#splash .rp2{display:none}#splash .wm i{transform:none;filter:none}}
</style></head><body>
<div id="splash" aria-label="Gramcord"><div class="glow"></div>
<div class="av2"><svg class="em" viewBox="-30 -30 160 160" aria-hidden="true">
<circle class="rp1" cx="50" cy="50" r="72"/><circle class="rp2" cx="50" cy="50" r="72"/>
<circle class="crc" cx="50" cy="50" r="72"/>
<path class="ring" d="M50 6C26 6 8 24 8 46c0 12 5 22 13 30-1 7-4 13-9 17 9 0 17-3 23-8 5 2 10 3 15 3 24 0 42-18 42-40S74 6 50 6Z"/>
<path class="gl" d="M66 35C62 30 56 28 50 28c-10 0-18 8-18 18s8 18 18 18c8 0 15-5 16-13H51"/>
</svg></div><div class="wm"><i style="animation-delay:1.90s">G</i><i style="animation-delay:1.97s">r</i><i style="animation-delay:2.04s">a</i><i style="animation-delay:2.11s">m</i><i style="animation-delay:2.18s">c</i><i style="animation-delay:2.25s">o</i><i style="animation-delay:2.32s">r</i><i style="animation-delay:2.39s">d</i></div></div>

<script>(function(){var s=document.getElementById('splash');if(!s)return;[].forEach.call(s.querySelectorAll('.ring,.gl,.crc'),function(e){try{var l=Math.ceil(e.getTotalLength())+2;e.style.strokeDasharray=l;e.style.strokeDashoffset=l}catch(x){}})})();</script>
<div id="app">
 <section id="login"><div class="card">
  <div id="s1" style="display:grid;gap:14px">
   <h1>Gramcord</h1><div class="mu">Войдите по номеру телефона. Мы отправим код подтверждения.</div>
   <input id="ph" type="tel" inputmode="tel" placeholder="+7 900 000 00 00" autocomplete="tel">
   <div class="err" id="e1"></div><button class="btn" id="send">Получить код</button>
  </div>
  <div id="s2" style="display:none;gap:14px">
   <h1>Введите код</h1><div class="mu" id="hint"></div>
   <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
   <div class="err" id="e2"></div><button class="btn" id="go">Войти</button>
   <button class="btn g" id="back1">Изменить номер</button>
    <button class="btn g" id="rs" disabled>Отправить код ещё раз</button>
  </div>
  <div id="s3" style="display:none;gap:14px">
   <h1>Как вас зовут?</h1><div class="mu">Имя и юзернейм увидят другие участники. Юзернейм от 5 символов, позже его можно сменить в настройках.</div>
   <input id="nm0" maxlength="30" placeholder="Ваше имя" autocomplete="nickname">
   <input id="un0" maxlength="32" placeholder="Юзернейм: a-z, 0-9, _" autocapitalize="none" autocomplete="username">
   <div class="err" id="e3"></div><button class="btn" id="ok3">Продолжить</button>
  </div>
 </div></section>
 <div id="main" style="display:none">
  <nav id="rail"></nav>
  <aside id="chans"><h2 id="sn"></h2><div id="cl"></div>
   <div id="me"><div class="av" id="mav"></div><div class="nm" id="mnm"></div><button id="adb" aria-label="Админ-панель" style="font-size:20px;display:none"></button><button id="gear" aria-label="Настройки" style="font-size:20px"></button></div>
  </aside>
  <section id="chat">
   <div id="hd"><button id="bk" aria-label="Назад">←</button><span id="ct"></span></div>
   <div id="msgs"></div>
   <div id="cmp"><input id="mi" placeholder="Сообщение" autocomplete="off"><button class="btn" id="ms">Отправить</button></div>
   <div id="music" style="display:none"></div>
  </section>
 </div>
 <div id="mini"><button id="mpp" aria-label="Пауза/play" style="font-size:20px"></button><button class="nm" id="mt" style="text-align:left"></button><button id="mn" aria-label="Следующий" style="font-size:20px"></button></div>
</div>
<div id="set"><div id="tabs"></div><div id="sb"></div></div>
<div id="toast"></div>
<input type="file" id="fi" accept="audio/*" multiple hidden><input type="file" id="pf" accept="image/*" hidden>
<script>
/* ====== НАСТРОЙКИ ВХОДА (меняй здесь) ====== */
const CONFIG={
 ANY_PHONE:true,     // true: подойдёт любой номер
 FIXED_PHONE:"",     // если ANY_PHONE=false: только этот номер (цифры, например "79001234567")
 ANY_CODE:true,      // true: подойдёт любой код нужной длины
 RANDOM_CODE:true,   // true: код генерируется случайно и показывается в уведомлении
 FIXED_CODE:"12345", // код, если RANDOM_CODE=false и ANY_CODE=false
 CODE_LENGTH:5
};
/* ============================================ */
const $=s=>document.querySelector(s);
const IC={play:'<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>',pause:'<path d="M8 5v14M16 5v14"/>',next:'<path d="M6 5l10 7-10 7zM19 5v14"/>',prev:'<path d="M18 5L8 12l10 7zM5 5v14"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',clip:'<path d="M20 11.5l-8 8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7l-8.5 8.5a1.7 1.7 0 01-2.4-2.4L15 7"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v4h4"/>',note:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/>'};
const ico=(n,z)=>'<svg class="ic" viewBox="0 0 24 24" width="'+(z||20)+'" height="'+(z||20)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
const ibtn=(n,c)=>{const b=document.createElement('button');if(c)b.className=c;b.innerHTML=ico(n);return b};
$('#adb').innerHTML=ico('shield');$('#gear').innerHTML=ico('gear');$('#mpp').innerHTML=ico('play');$('#mn').innerHTML=ico('next');
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const S={g(k,d){try{const v=localStorage.getItem('gc_'+k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem('gc_'+k,JSON.stringify(v))}catch(e){}},r(k){try{localStorage.removeItem('gc_'+k)}catch(e){}}};
const SRV=[{n:'Дом',e:'🏠',ch:[['общий','t'],['заметки','t'],['музыка','m']]},{n:'Проект',e:'🛠',ch:[['новости','t'],['идеи','t'],['музыка','m']]}];
let user=S.g('user',null),sess=S.g('sess',null),sid=S.g('sid',null),msgs=S.g('msgs',null),cur={s:0,c:0},sent='',phone='',tab='Профиль',users=S.g('users',null),BX=S.g('bx',[]),opn=null,names=S.g('names',[{u:'cord',price:500,owner:null},{u:'ceo',price:2500,owner:null}]);
const ADMIN_PHONE='0000000',ADMIN_CODE='99901';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),4500)}
function theme(v){v=v||S.g('theme','dark');S.s('theme',v);if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}
const dev=()=>{const u=navigator.userAgent;return (/iPhone|iPad/.test(u)?'iPhone':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Linux')+' · '+(/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':'Браузер')};
const hm=ts=>new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const dt=ts=>new Date(ts).toLocaleDateString()+' '+hm(ts);

/* ===== вход ===== */
const digits=s=>s.replace(/\D/g,'');
function genCode(){let c='';if(CONFIG.RANDOM_CODE){for(let i=0;i<CONFIG.CODE_LENGTH;i++)c+=Math.floor(Math.random()*10)}else c=CONFIG.FIXED_CODE;return c}
function sendCode(){sent=genCode();toast('Демо-режим: SMS не отправляется. Ваш код: '+sent)}
$('#send').onclick=()=>{const d=digits($('#ph').value);
 if(d.length<7){$('#e1').textContent='Введите номер полностью, минимум 7 цифр.';return}
 if(d!==ADMIN_PHONE&&!CONFIG.ANY_PHONE&&d!==digits(CONFIG.FIXED_PHONE)){$('#e1').textContent='Этот номер не зарегистрирован.';return}
 phone=d;$('#e1').textContent='';if(d===ADMIN_PHONE){sent=ADMIN_CODE}else sendCode();$('#hint').textContent='Код отправлен на +'+d+'.';$('#s1').style.display='none';$('#s2').style.display='grid';$('#code').focus()};
$('#back1').onclick=()=>{$('#s2').style.display='none';$('#s1').style.display='grid'};
$('#go').onclick=()=>{const c=digits($('#code').value);let ok;
 if(phone===ADMIN_PHONE)ok=c===ADMIN_CODE;else if(CONFIG.ANY_CODE)ok=c.length===CONFIG.CODE_LENGTH;else ok=c===sent;
 if(!ok){$('#e2').textContent=CONFIG.ANY_CODE?'Код должен содержать '+CONFIG.CODE_LENGTH+' цифр.':'Неверный код. Проверьте и попробуйте ещё раз.';return}

function upAnim(g){return new Promise(done=>{
 const L=GL(g),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,o=h('div');o.id='gup';

 (async()=>{
  for(let i=0;i<N&&!skip;i++){
   if(i<LB){let b;do{b=Math.floor(Math.random()*BD.length)}while(b===pb);pb=b;setB(b)}else setB(g.up.b,1);
   let m;do{m=Math.floor(Math.random()*L.L.length)}while(m===pm);pm=m;setM(m);

  const r=rar(g),lr=q('.lr');lr.textContent='Редкость: '+r.t;lr.style.color=r.c;
